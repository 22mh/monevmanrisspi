<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIM-Risiko RSD K.R.M.T Wongsonegoro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A3161C; --red-ink:#7E0F14; --gold:#C99700; --gold-soft:#FFF4D1;
  --ink:#1B1F23; --ink-2:#4A535C; --ink-3:#6E7781;
  --paper:#FFFFFF; --surface:#F3F4F6; --surface-2:#E9EBEE; --line:#DADDE1;
  --lv1:#2E75B6; --lv2:#3A9D4A; --lv3:#F2C200; --lv4:#C62828; --lv3-ink:#1B1F23;
  --ok:#2E7D32; --warn:#B26A00; --bad:#C62828;
  --focus:#2E75B6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --red:#E0565B; --red-ink:#FF8A8E; --gold:#E3B33C; --gold-soft:#3A3115;
    --ink:#ECEEF0; --ink-2:#C2C8CE; --ink-3:#98A1AA;
    --paper:#1A1D21; --surface:#111316; --surface-2:#24282D; --line:#33383E;
    --lv3-ink:#1B1F23; --focus:#6CB2F0; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --red:#E0565B; --red-ink:#FF8A8E; --gold:#E3B33C; --gold-soft:#3A3115;
  --ink:#ECEEF0; --ink-2:#C2C8CE; --ink-3:#98A1AA;
  --paper:#1A1D21; --surface:#111316; --surface-2:#24282D; --line:#33383E;
  --lv3-ink:#1B1F23; --focus:#6CB2F0; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--surface);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--paper);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 4px}
.brand img{width:40px;height:auto}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--ink-3);font-size:12px;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:14px}
.nav button .lp{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:700}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .grp{font-size:12px;color:var(--ink-3);padding:10px 10px 4px;font-weight:600}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.who .r{display:flex;align-items:center;gap:8px}
.who img{width:28px;height:28px;border-radius:50%}
.rolepill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.rp-L1{background:#FBE3E4;color:#7E0F14}.rp-L2{background:var(--gold-soft);color:#6B5000}.rp-L3{background:#DCEBF8;color:#1C4E7A}
:root[data-theme="dark"] .rp-L1{background:#4A1D1F;color:#FFB3B5}
/* main */
.main{padding:22px 28px 40px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.sub{color:var(--ink-3);font-size:14px;margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px}
select,input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;max-width:100%}
textarea{min-height:70px;resize:vertical;width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px;min-height:36px}
.btn:hover{background:var(--surface)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .h{font-size:12px;color:var(--ink-3)}
.kpi.alert .v{color:var(--bad)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:var(--gold-soft);border:1px solid #E8D28A;color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.lv{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700;font-size:13px;white-space:nowrap}
.lv-1{background:var(--lv1);color:#fff}.lv-2{background:var(--lv2);color:#fff}.lv-3{background:var(--lv3);color:var(--lv3-ink)}.lv-4{background:var(--lv4);color:#fff}.lv-0{background:var(--surface-2);color:var(--ink-3)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--paper)}
.tag.ok{border-color:#9BCB9E;color:var(--ok);background:#EEF7EE}.tag.bad{border-color:#E7A3A3;color:var(--bad);background:#FDEEEE}.tag.warn{border-color:#E6C27A;color:var(--warn);background:#FFF6E3}
:root[data-theme="dark"] .tag.ok,:root[data-theme="dark"] .tag.bad,:root[data-theme="dark"] .tag.warn{background:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.ok,:root:not([data-theme="light"]) .tag.bad,:root:not([data-theme="light"]) .tag.warn{background:transparent}}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* heatmap */
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(44px,1fr));gap:4px;align-items:stretch}
.heat .c{aspect-ratio:1.6;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;cursor:pointer;border:0;text-align:left}
.heat .c .s{font-size:11px;opacity:.8}
.heat .c .n{font-size:22px;font-weight:800;align-self:flex-end;line-height:1}
.heat .c.z .n{opacity:.35;font-weight:600;font-size:16px}
.heat .ax{font-size:12px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-weight:700}
.heat .c:hover{filter:brightness(1.06)}
.bars .b{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bars .t i{display:block;height:100%}
.alerts li{margin:0 0 8px;font-size:14px}
.alerts{padding-left:18px;margin:0}
.chk{font-weight:800}
.chk.y{color:var(--ok)}.chk.n{color:var(--bad)}.chk.na{color:var(--ink-3);font-weight:500}
/* modal */
dialog{border:0;border-radius:14px;padding:0;width:min(860px,94vw);max-height:90vh;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(17,19,22,.5)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.mh h2{margin:0;font-size:17px}
.mb{padding:16px 18px;overflow:auto;max-height:calc(90vh - 130px)}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper)}
.fs{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.fs legend{font-weight:700;padding:0 6px;font-size:14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.f > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.f .hint{font-size:12px;color:var(--ink-3)}
.f input,.f select,.f textarea{width:100%}
.fg{display:grid;gap:10px}
.fg2{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:repeat(3,1fr)}.fg4{grid-template-columns:repeat(4,1fr)}
.calc{background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rows .rr{display:grid;gap:6px;margin-bottom:6px;align-items:start}
.rows .rr > *{min-width:0;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90vw}
details.g{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 16px;margin-bottom:10px}
details.g summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g summary .st{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
details.g[open] summary{border-bottom:1px solid var(--line)}
details.g .gb{padding:12px 0 14px;font-size:14px}
details.g .gb p{margin:0 0 8px;max-width:78ch}
details.g .gb ol,details.g .gb ul{margin:0 0 8px;padding-left:20px;max-width:78ch}
.ex{background:var(--surface);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.ex b{color:var(--red-ink)}
.mobilebar{display:none}
.acts{display:flex;flex-wrap:wrap;gap:4px;min-width:140px}
.acts .btn.sm{padding:3px 8px;min-height:28px;font-size:12px}
dialog.wide{width:min(1100px,96vw)}
.hist{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hist ul.diff{margin:6px 0;padding-left:18px}
.hist details summary{cursor:pointer;color:var(--focus);margin-top:4px}
.pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:0;max-height:240px;overflow:auto}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}
.prog .t{flex:1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.prog .t i{display:block;height:100%;background:var(--lv2)}
.prog b{font-size:12px;min-width:34px;text-align:right}
.dl{display:grid;grid-template-columns:200px 1fr;gap:4px 14px;margin:0 0 10px;font-size:14px}
.dl dt{color:var(--ink-3);font-weight:600}
.dl dd{margin:0}
.sec{font-size:15px;font-weight:700;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.fish{display:grid;grid-template-columns:repeat(3,1fr) 150px;gap:8px;align-items:stretch;margin:6px 0 10px}
.fish .b{background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px;min-height:64px}
.fish .b h4{margin:0 0 4px;font-size:12px;color:var(--red-ink)}
.fish .spine{grid-column:1/4;height:4px;background:var(--ink-3);border-radius:2px;align-self:center;position:relative}
.fish .spine::after{content:"";position:absolute;right:-2px;top:-6px;border-left:12px solid var(--ink-3);border-top:8px solid transparent;border-bottom:8px solid transparent}
.fish .head{grid-row:1/4;grid-column:4;background:var(--red);color:#fff;border-radius:8px;padding:10px;display:flex;align-items:center;font-size:13px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px 8px 0 0;font-weight:600;font-size:14px;color:var(--ink-2);border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tabs button[aria-selected="true"]{background:var(--paper);border-color:var(--line);color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--focus)}
.kk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--paper)}
.kk-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.kk-h b{flex:1;min-width:240px}
.kk-sys{background:var(--surface);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13px}
.kk-g{display:grid;grid-template-columns:190px 1fr 1.4fr;gap:8px;align-items:start}
.kk-g textarea{min-height:38px}
.area-h{font-size:15px;font-weight:700;margin:14px 0 8px}
@media (max-width:980px){.kk-g{grid-template-columns:1fr}}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:8px 0}
.flow span{background:var(--surface);border-radius:999px;padding:3px 10px}
.flow i{color:var(--ink-3);font-style:normal}
@media (max-width:980px){.dl{grid-template-columns:1fr}.fish{grid-template-columns:1fr}.fish .spine,.fish .head{grid-column:auto;grid-row:auto}}
.login{max-width:420px;margin:8vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px 24px 20px;box-shadow:var(--shadow)}
.login .lb{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.login .lb img{width:48px}
.login h1{font-size:22px}
.login .alt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.login .alt a{cursor:pointer}
.login .btn.pri{width:100%;margin-top:6px}
.app.auth{grid-template-columns:1fr}.app.auth .side{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap}
  .nav button .lp{display:none}
  .who{margin-top:0}
  .g2,.g3{grid-template-columns:1fr}
  .fg2,.fg3,.fg4{grid-template-columns:1fr}
  .main{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.topbar .filters,.btn{display:none!important}.app{display:block}}
</style>
</head>

  if (col !== "units") return localLog(col, id, unitOfRow(col, id, baru || lama), lama, baru);
  const strip = (u) => { if (!u) return null; const { konteks: _k, ...r } = u; return r; };
  localLog("units", id, id, strip(lama), strip(baru));
  const lk = (lama && lama.konteks) || {}, bk = (baru && baru.konteks) || {};
  new Set([...Object.keys(lk), ...Object.keys(bk)]).forEach((t) => localLog("konteks", `${id}/${t}`, id, lk[t] || null, bk[t] || null));
}
function loadLocal() { try { S.riwayatLocal = JSON.parse(localStorage.getItem(RKEY) || "[]"); } catch (e) { S.riwayatLocal = []; } try { const o = JSON.parse(localStorage.getItem(LKEY) || "null"); if (o) { COLS.forEach((c) => (S[c] = o[c] || {})); if (o.cfg) S.cfg = Object.assign(S.cfg, o.cfg); } } catch (e) {} }

/* Pesan galat dari basis data dalam bahasa pengguna */
function sbError(e) {
  const msg = (e && e.message) || "";
  if (!e) return "Gagal menyimpan.";
  if (e.code === "42501" || /row-level security/i.test(msg)) return "Ditolak: akun Anda tidak berhak mengubah data ini.";
  if (e.code === "P0001") return msg;
  if (e.code === "23514") return "Data tidak memenuhi aturan basis data (misalnya peran Lini 1 wajib memiliki unit).";
  if (/fetch|network|Failed to/i.test(msg)) return "Tidak terhubung ke server. Periksa koneksi, lalu coba lagi.";
  return "Gagal menyimpan: " + (msg || "kesalahan tidak dikenal");
}
/* Tulis satu baris. Baris lama diperbarui (update), baris baru ditambah (insert),
   sehingga setiap aksi diperiksa oleh kebijakan RLS yang tepat. */
async function sbWrite(table, key, row, exists) {
  let q;
  if (exists) { q = SB.from(table).update({ data: row.data }); for (const [k, v] of Object.entries(key)) q = q.eq(k, v); }
  else q = SB.from(table).insert(Object.assign({}, key, row));
  const { data, error } = await q.select(Object.keys(key).join(","));
  if (error && !exists && error.code === "23505") return sbWrite(table, key, row, true);
  if (error) return error;
  if (!data || !data.length) return { code: "42501", message: "row-level security" };
  return null;
}
async function put(col, id, data) {
  data.updatedAt = new Date().toISOString();
  if (S.mode === "db") {
    let err = null;
    if (col === "units") {
      const { konteks: kt, ...rest } = data;
      err = await sbWrite("units", { id }, { data: rest }, !!S.units[id]);
      if (!err && kt) for (const [t, k] of Object.entries(kt)) {
        const prev = S.units[id]?.konteks?.[t];
        if (prev && JSON.stringify(prev) === JSON.stringify(k)) continue;
        err = await sbWrite("konteks", { unit_id: id, tahun: +t }, { data: k }, !!prev);
        if (err) break;
      }
    } else err = await sbWrite(col, { id }, { data }, !!S[col][id]);
    if (err) { toast(sbError(err)); scheduleReload(col); return false; }
    S[col][id] = data;
    if (col === "members" || col === "roles") recomputeMe();
    render(); return true;
  }
  localLogPut(col, id, S[col][id] ? JSON.parse(JSON.stringify(S[col][id])) : null, JSON.parse(JSON.stringify(data)));
  S[col][id] = data; saveLocal(); render(); return true;
}
async function del(col, id) {
  if (S.mode === "db") {
    const { data, error } = await SB.from(col).delete().eq("id", id).select("id");
    if (error || !data || !data.length) { toast(error ? sbError(error) : "Ditolak: akun Anda tidak berhak menghapus data ini."); return false; }
    delete S[col][id]; render(); return true;
  }
  localLogPut(col, id, S[col][id] ? JSON.parse(JSON.stringify(S[col][id])) : null, null);
  delete S[col][id]; saveLocal(); render(); return true;
}
async function delKonteks(unitId, tahun) {
  if (S.mode === "db") {
    const { data, error } = await SB.from("konteks").delete().eq("unit_id", unitId).eq("tahun", +tahun).select("unit_id");
    if (error || !data || !data.length) { toast(error ? sbError(error) : "Ditolak: akun Anda tidak berhak menghapus konteks ini."); return false; }
  }
  const u = JSON.parse(JSON.stringify(S.units[unitId])); const lama = u.konteks?.[tahun] || null;
  if (u.konteks) delete u.konteks[tahun];
  if (S.mode === "local") { localLog("konteks", `${unitId}/${tahun}`, unitId, lama, null); S.units[unitId] = u; saveLocal(); }
  else S.units[unitId] = u;
  render(); return true;
}
async function putCfg(cfg) {
  if (S.mode === "db") { const err = await sbWrite("config", { id: "main" }, { data: cfg }, true); if (err) { toast(sbError(err)); return; } S.cfg = cfg; render(); }
  else { S.cfg = cfg; saveLocal(); render(); }
}

/* Pembacaan data: hanya baris yang diizinkan RLS yang dikembalikan server. */
async function fetchAll(table, cols) {
  const out = [], size = 1000;
  for (let from = 0; ; from += size) {
    const { data, error } = await SB.from(table).select(cols).range(from, from + size - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < size) break;
  }
  return out;
}
async function loadTable(c) {
  if (c === "units") {
    const [u, k] = await Promise.all([fetchAll("units", "id,data"), fetchAll("konteks", "unit_id,tahun,data")]);
    const o = {}; u.forEach((r) => (o[r.id] = Object.assign({}, r.data, { konteks: {} })));
    k.forEach((r) => { if (o[r.unit_id]) o[r.unit_id].konteks[r.tahun] = r.data; });
    S.units = o;
  } else if (c === "config") {
    const rows = await fetchAll("config", "id,data"); const m = rows.find((r) => r.id === "main");
    S.cfg = Object.assign({}, CFG_DEFAULT, m ? m.data : {});
  } else if (c === "kka") {
    // Tabel KKA ditambahkan pada versi 3. Bila skrip SQL terbaru belum dijalankan, aplikasi tetap berjalan.
    try { const rows = await fetchAll(c, "id,data"); const o = {}; rows.forEach((r) => (o[r.id] = r.data)); S.kka = o; S.ui.kkaMissing = false; }
    catch (e) { S.kka = {}; S.ui.kkaMissing = true; }
  } else {
    const rows = await fetchAll(c, "id,data"); const o = {}; rows.forEach((r) => (o[r.id] = r.data)); S[c] = o;
  }
  S.loaded[c] = true;
}
async function loadAll() { await Promise.all([...COLS, "config"].map(loadTable)); recomputeMe(); render(); }
const pendingReload = new Set(); let reloadT = 0;
function scheduleReload(c) {
  if (S.mode !== "db") return;
  pendingReload.add(c); clearTimeout(reloadT);
  reloadT = setTimeout(async () => {
    const cs = [...pendingReload]; pendingReload.clear();
    try { await Promise.all(cs.map(loadTable)); } catch (e) {}
    if (cs.includes("roles") || cs.includes("members")) recomputeMe();
    render();
  }, 300);
}

async function init() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    if (!window.supabase || !window.supabase.createClient) { S.mode = "error"; S.ui.err = "Pustaka Supabase gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman."; render(); return; }
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    SB.auth.onAuthStateChange((ev) => {
      if (ev === "PASSWORD_RECOVERY") { if (S.mode === "db") openPassword(true); else S.ui.recovery = true; return; }
      if ((ev === "SIGNED_IN" && S.mode === "login") || (ev === "SIGNED_OUT" && S.mode === "db")) location.reload();
    });
    let session = null;
    try { ({ data: { session } } = await SB.auth.getSession()); } catch (e) {}
    if (!session) { S.mode = "login"; render(); return; }
    await startSession(session.user);
    if (S.ui.recovery) openPassword(true);
  } else {
    S.mode = "local"; loadLocal(); S.me.role = S.ui.localRole || "L2"; S.me.canAdmin = true; S.loaded = {}; COLS.forEach((c) => (S.loaded[c] = true));
  }
  render();
}
async function startSession(u) {
  S.mode = "db"; S.loaded = {};
  S.me.id = u.id; S.me.email = u.email || ""; S.me.name = u.user_metadata?.nama || u.email || "";
  try { const { data } = await SB.rpc("my_access"); S.me.isOwner = !!(data && data.is_admin); } catch (e) {}
  try { await loadAll(); }
  catch (e) { S.mode = "error"; S.ui.err = /relation|does not exist|schema cache/i.test(e?.message || "") ? "Tabel belum dibuat. Jalankan 01_skema_simrisiko.sql di Supabase SQL Editor." : sbError(e); render(); return; }
  SB.channel("simrisiko").on("postgres_changes", { event: "*", schema: "public" }, (p) => scheduleReload(p.table === "konteks" ? "units" : p.table)).subscribe();
}
/* Peran efektif hanya dari tabel "roles" (ditulis admin/SPI).
   Tabel "members" berisi permintaan peran dari pengguna sendiri. */
function recomputeMe() {
  if (S.mode !== "db") return;
  const r = S.roles[S.me.id], m = S.members[S.me.id];
  S.me.role = r?.role || null; S.me.unitId = r?.unitId || null;
  S.me.canAdmin = !!S.me.isOwner || S.me.role === "L3";
  S.me.pending = !r && !!m?.role;
  const key = `${S.me.role}|${S.me.unitId}`;
  if (S.ui.roleKey !== undefined && S.ui.roleKey !== key) { S.ui.roleKey = key; loadAll().catch(() => {}); return; }
  S.ui.roleKey = key;
  if (!r && m?.role && S.me.isOwner && S.loaded?.roles && S.loaded?.members && !S.ui.promoted) {
    S.ui.promoted = true;
    put("roles", S.me.id, { role: m.role, unitId: m.unitId || "", jabatan: m.jabatan || "", nama: m.nama || S.me.name, email: m.email || S.me.email, approvedBy: S.me.id, approvedAt: new Date().toISOString() });
  }
}

/* ---- Riwayat perubahan ---- */
async function loadRiwayat(tabel, recId, opts = {}) {
  const tabs = tabel ? (Array.isArray(tabel) ? tabel : [tabel]) : null;
  if (S.mode === "db") {
    let q = SB.from("riwayat").select("id,tabel,rec_id,unit_id,aksi,data_lama,data_baru,oleh_email,oleh_nama,at");
    if (tabs) q = q.in("tabel", tabs);
    if (recId) q = q.eq("rec_id", recId);
    if (opts.unit) q = q.eq("unit_id", opts.unit);
    const { data, error } = await q.order("at", { ascending: false }).limit(opts.limit || 200);
    if (error) throw error;
    return data || [];
  }
  return S.riwayatLocal.filter((e) => (!tabs || tabs.includes(e.tabel)) && (!recId || e.rec_id === recId) && (!opts.unit || e.unit_id === opts.unit))
    .sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, opts.limit || 200);
}
const SKIP_DIFF = ["updatedAt", "validatedAt", "validatedBy", "by", "createdAt", "sentBy", "sentByName", "approvedBy", "approvedAt", "konteks"];
function fmtVal(k, v, full) {
  if (v === null || v === undefined || v === "") return "–";
  if (k === "unitId") return unitName(v);
  if (k === "riskId") return S.risks[v]?.kode || S.risks[v]?.peristiwa || String(v);
  if (k === "target" && /^\d{4}-\d$/.test(String(v))) return plabel(v);
  if (Array.isArray(v)) return `${v.length} butir`;
  if (typeof v === "object") return "rincian diperbarui";
  if (typeof v === "boolean") return v ? "Ya" : "Tidak";
  const s = String(v); return !full && s.length > 140 ? s.slice(0, 140) + "…" : s;
}
function diffList(a, b) {
  a = a || {}; b = b || {};
  return [...new Set([...Object.keys(a), ...Object.keys(b)])]
    .filter((k) => !SKIP_DIFF.includes(k) && JSON.stringify(a[k]) !== JSON.stringify(b[k]))
    .map((k) => ({ label: FIELD_LABEL[k] || k, from: fmtVal(k, a[k]), to: fmtVal(k, b[k]) }));
}
function versionTable(d) {
  if (!d) return `<p class="muted small">Tidak ada isi.</p>`;
  return `<div class="tablewrap"><table>${Object.entries(d).filter(([k]) => k !== "konteks").map(([k, v]) => `<tr><th style="white-space:normal;width:28%">${esc(FIELD_LABEL[k] || k)}</th><td>${v && typeof v === "object" ? `<pre class="pre">${esc(JSON.stringify(v, null, 2))}</pre>` : esc(fmtVal(k, v, true))}</td></tr>`).join("")}</table></div>`;
}
function riwayatEntryHtml(e, showTabel) {
  const d = diffList(e.data_lama, e.data_baru);
  const top = `<div class="row"><b>${esc(e.aksi)}</b>${showTabel ? `<span class="tag">${esc(TABEL_LABEL[e.tabel] || e.tabel)}</span>` : ""}<span class="spacer"></span><span class="muted small">${fmtDT(e.at)} · ${esc(e.oleh_nama || e.oleh_email || "Sistem")}</span></div>`;
  let body;
  if (e.aksi === "Diubah") body = d.length ? `<ul class="small diff">${d.map((x) => `<li><b>${esc(x.label)}:</b> <span class="muted">${esc(x.from)}</span> → ${esc(x.to)}</li>`).join("")}</ul>` : `<p class="small muted" style="margin:6px 0">Perubahan pada rincian bertingkat. Buka isi versi untuk melihatnya.</p>`;
  else if (e.aksi === "Dibuat") body = `<p class="small muted" style="margin:6px 0">Data dibuat.</p>`;
  else body = `<p class="small muted" style="margin:6px 0">Data dihapus. Isi terakhirnya tetap tersimpan.</p>`;
  return `<div class="hist">${top}${body}<details><summary class="small">Lihat isi ${e.aksi === "Dihapus" ? "sebelum dihapus" : "versi ini"}</summary>${versionTable(e.data_baru || e.data_lama)}</details></div>`;
}
async function openRiwayat(tabel, recId, judul) {
  openModal(`Riwayat · ${judul || TABEL_LABEL[Array.isArray(tabel) ? tabel[0] : tabel] || ""}`, `<p class="muted">Memuat riwayat…</p>`, { readOnly: true, wide: true });
  const seq = modalSeq;
  try {
    const rows = await loadRiwayat(tabel, recId);
    if (seq !== modalSeq) return;
    $("#dlgBody").innerHTML = rows.length ? `<p class="small muted" style="margin-top:0">${rows.length} catatan, terbaru di atas. Riwayat dicatat otomatis oleh sistem dan tidak dapat diubah atau dihapus.</p>${rows.map((e) => riwayatEntryHtml(e, Array.isArray(tabel))).join("")}` : `<p class="muted">Belum ada riwayat untuk data ini.</p>`;
  } catch (e) { if (seq === modalSeq) $("#dlgBody").innerHTML = `<p class="muted">Riwayat gagal dimuat: ${esc(e?.message || "")}</p>`; }
}

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "authForm") return;

  const f = Object.fromEntries([...e.target.querySelectorAll("[name]")].map((el) => [el.name, el.value.trim()]));

  const rt = Object.entries(S.rtps).filter(([, x]) => x.unitId === unitId && S.risks[x.riskId] && +S.risks[x.riskId].tahun === +t);
  const ev = Object.values(S.events).filter((e) => e.unitId === unitId && new Date(e.waktuKejadian).getFullYear() === +t);

    ["Risiko teridentifikasi", rs.length > 0],
    ["Semua risiko tervalidasi UMR", rs.length ? rs.every(([, r]) => r.status === "Tervalidasi") : null],
    ["Risiko prioritas memiliki RTP", prio.length ? prio.every(([id]) => rt.some(([, x]) => x.riskId === id)) : null],
    ["RCA risiko Tinggi/Sangat Tinggi ≤ 45 hari", rs.some(([, r]) => needsRCA(r)) ? rs.every(([, r]) => rcaState(r) !== "late") : null],
    ["Implementasi RTP tercatat", rt.length ? rt.every(([, x]) => (x.impl || []).length || rtpDone(x)) : null],
    ["Tidak ada RTP terlambat", rt.length ? rt.every(([, x]) => rtpStatus(x) !== "Terlambat") : null],
    [`Laporan ${plabel(pkey(t, tw))} dikirim`, rep?.status === "Dikirim"],
    ["KTD/Sentinel dilaporkan ke SIK", sik.length ? sik.every((e) => e.sik === "Ya") : null],
    ["Sentinel/kejadian signifikan dilaporkan ≤ 1×24 jam", w24.length ? w24.every(ok24) : null],
  ];

}

function unitSummary(unitId, t, tw) {
  const key = pkey(t, tw);

  const rt = Object.entries(S.rtps).filter(([, x]) => x.unitId === unitId && S.risks[x.riskId] && +S.risks[x.riskId].tahun === +t);
  const ev = Object.entries(S.events).filter(([, e]) => e.unitId === unitId && inPeriod(e.waktuKejadian, t, tw));
  const due = rt.filter(([, x]) => x.target === key), done = due.filter(([, x]) => rtpDone(x));

  return { rs, rt, ev, due, done, merah: rs.filter(([, r]) => lvl(res(r)).i === 4).length, prio: rs.filter(([, r]) => isPrio(r)).length, late: rt.filter(([, x]) => rtpStatus(x) === "Terlambat").length, sikOk: sik.filter(([, e]) => e.sik === "Ya").length, sikN: sik.length, topEv };

    ["Isi konteks unit (Lampiran 1)", `<p>${M("Konteks unit", "Isi konteks")}. Isi bagian A–E: identitas unit dan pemilik risiko, visi-misi, sasaran/IKU, proses bisnis, pemangku kepentingan, dan <b>selera risiko</b> dalam kalimat serta angka.</p><p>Di awal tahun berikutnya gunakan <b>Salin dari [tahun lalu]</b>. Konteks tahun lain dibuka lewat tombol tahun di kartu unit. <b>Ubah</b>, <b>Hapus</b>, dan <b>Riwayat</b> tersedia di kartu yang sama.</p>${ex(`<b>Contoh:</b> sasaran "Kejadian pasien jatuh = 0 per tahun"; selera "tidak mentoleransi pasien jatuh dengan cedera berat", batas skor ≤ 12.`)}`],
    ["Identifikasi dan analisis risiko (Lampiran 2–4)", `<p>${M("Register risiko", "Tambah risiko")}. Isi tiga bagian:</p><ol><li><b>Identifikasi:</b> sasaran terkait, kategori, peristiwa, penyebab, dan dampak. Aplikasi merangkainya menjadi pernyataan risiko.</li><li><b>Inheren:</b> K dan D beserta dasar datanya.</li><li><b>Residu:</b> pengendalian yang ada, efektivitas, bukti, serta K dan D residu.</li></ol><p>Pilih <b>Simpan draf</b> bila belum selesai, atau <b>Simpan dan ajukan ke UMR</b> bila sudah lengkap.</p>${ex(`<b>Keliru:</b> "Kekurangan perawat" (itu penyebab).<br><b>Benar:</b> Kemungkinan pasien risiko tinggi jatuh, yang disebabkan asesmen ulang tidak dilakukan tiap shift, sehingga cedera dan masa rawat bertambah.`)}`],
    ["Kelola risiko di register", `<p>Setiap baris register memiliki tombol:</p><ul><li><b>Lihat:</b> ringkasan lengkap risiko, RCA, RTP, progres implementasi, dan peristiwa terkait.</li><li><b>Ubah:</b> mengubah isian. Risiko yang sudah tervalidasi akan diajukan ulang ke UMR.</li><li><b>Tarik pengajuan:</b> mengembalikan risiko berstatus Diajukan menjadi Draf.</li><li><b>Nilai ulang:</b> memperbarui skor residu risiko tervalidasi tanpa validasi ulang, misalnya penilaian semesteran.</li><li><b>Hapus</b> dan <b>Riwayat</b>.</li></ul><p>Bila UMR mengembalikan risiko, statusnya menjadi <b>Perlu revisi</b> beserta catatan UMR. Perbaiki, lalu ajukan kembali.</p>`],
    ["Analisis akar masalah (Lampiran 6)", `<p>${M("Analisis akar masalah", "Isi RCA")}, atau tombol <b>Isi RCA</b> di register. RCA wajib untuk residu Tinggi dan Sangat Tinggi, paling lama 45 hari sejak validasi. Templat berisi:</p><ol><li>Identitas: metode, tanggal, dan tim RCA.</li><li>Uraian masalah dan data pendukung.</li><li>5 Why.</li><li>Diagram tulang ikan dengan 6 kategori: manusia, metode, peralatan, bahan, lingkungan, dan manajemen.</li><li>Akar penyebab beserta buktinya.</li><li>Rekomendasi.</li><li>Persetujuan Pemilik Risiko.</li></ol><p>Pilih <b>Simpan dan buat RTP</b> agar setiap rekomendasi langsung menjadi RTP.</p>`],
    ["Susun RTP (Lampiran 5)", `<p>${M("Rencana tindak (RTP)", "Tambah RTP")}. Templat berisi:</p><ol><li>Risiko prioritas dan akar penyebab yang disasar.</li><li>Kegiatan, pilihan penanganan, dan jenis pengendalian.</li><li>Penanggung jawab, pihak terkait, dan sumber daya/anggaran.</li><li>Indikator dan target capaiannya.</li><li>Target triwulan serta tanggal mulai dan selesai.</li><li>Estimasi K dan D setelah tindakan, yang harus berada di bawah selera unit.</li></ol>${ex(`<b>RI-PD-01:</b> formulir asesmen ulang Morse di e-RM · Kepala Ruang dan Tim SIMRS · kepatuhan ≥ 90% · TW IV · target 2×4 = 8.`)}`],
    ["Implementasi RTP", `<p>${M("Implementasi RTP", "Catat pelaksanaan")}. Catat setiap kali kegiatan dilaksanakan: tanggal, kegiatan yang dilakukan, progres kumulatif (%), status (berjalan, selesai, atau tertunda), capaian indikator, bukti, kendala, dan tindak lanjut. Semua catatan terlihat di <b>Log</b> dan dapat diubah atau dihapus.</p><p>Progres dan status di menu RTP, dasbor, dan laporan diperbarui otomatis. Progres 100% berarti RTP selesai; setelah itu lakukan <b>Nilai ulang</b> pada risikonya.</p>`],
    ["Realisasi triwulan (Lampiran 7)", `<p>Setiap akhir triwulan: ${M("Implementasi RTP", "Realisasi triwulan")}. Isian awal disusun dari catatan pelaksanaan pada triwulan tersebut. Lengkapi status Sudah atau Belum, efektivitas, capaian indikator, hambatan, dan tindak lanjut.</p>${ex(`<b>Terlaksana belum tentu efektif:</b> audit sudah berjalan, tetapi kepatuhan baru 72% dari target 90%. Pilih Sudah, lalu pilih efektivitas <b>Belum efektif</b>.`)}`],
    ["Catat peristiwa dan insiden (Lampiran 8)", `<p>${M("Peristiwa & insiden", "Catat peristiwa")}. Isi identitas kejadian, uraian dan dampak, penanganan (tindakan segera, koreksi, status tindak lanjut, perlu RCA), serta pelaporan (1×24 jam, SIK). Sentinel dan kejadian signifikan wajib dilaporkan ke Direktur dan UMR paling lambat 1×24 jam. KTD dan Sentinel wajib dilaporkan ke e-report Kemenkes.</p>`],
    ["Laporan triwulan (Lampiran 9)", `<p>${M("Laporan triwulan", "Susun laporan")}. Angka terisi otomatis. Lengkapi hambatan, rencana, dan rekomendasi, lalu pilih <b>Kirim laporan</b>. Bila UMR memberi status <b>Perlu perbaikan</b>, pilih <b>Perbaiki laporan</b> lalu kirim ulang. Semua periode tersimpan di <b>Riwayat laporan unit</b>.</p>`],
    ["Tanggapi temuan SPI", `<p>${M("Temuan SPI untuk unit", "Tanggapi")}. Isi tanggapan dan rencana tindak lanjut, target selesai, dan bukti. SPI memverifikasi, lalu menutup temuan bila hasilnya memadai.</p>`],
  ];
  const L2 = [
    ["Masuk dan ajukan peran Lini 2", `<p>Pilih peran <b>Lini 2 · Unit Manajemen Risiko</b>. Menu terbuka setelah disetujui admin atau SPI. UMR dapat membaca data semua unit, tetapi tidak dapat mengubah isian unit.</p>`],
    ["Validasi risiko", `<p>${M("Validasi dan reviu", "Periksa dan validasi")}. Centang 6 butir daftar periksa: pernyataan lengkap, sasaran, kategori, dasar K dan D, bukti residu, dan tidak duplikat. Lalu isi <b>kode risiko</b> dan pilih:</p><ul><li><b>Validasi</b>, bila semua butir terpenuhi;</li><li><b>Kembalikan untuk revisi</b>, dengan catatan untuk unit.</li></ul><p>Basis data menolak perubahan UMR pada isian unit.</p>`],
    ["Eskalasi risiko merah", `<p>${M("Validasi dan reviu", "Eskalasi")}. Untuk risiko Sangat Tinggi (Merah), catat tanggal, nomor nota dinas, dan ringkasan yang disampaikan ke Direktur. Arahan Direktur dicatat kemudian lewat <b>Ubah eskalasi</b>.</p>`],
    ["Pantau proses unit", `<p>Gunakan <b>Dasbor</b> (peta risiko dan daftar Perlu tindakan), <b>Register</b>, <b>RCA</b>, <b>RTP</b>, <b>Implementasi RTP</b>, dan <b>Peristiwa</b>. Semua dalam mode baca. Tombol <b>Riwayat</b> menunjukkan siapa mengubah apa.</p>`],
    ["Reviu laporan unit", `<p>${M("Validasi dan reviu", "Reviu")}, atau dari menu Laporan triwulan. Pilih <b>Diterima</b>, atau <b>Perlu perbaikan</b> dengan catatan. Unit akan melihat catatan tersebut dan mengirim ulang laporannya.</p>`],
    ["Laporan konsolidasi (Lampiran 10)", `<p>${M("Laporan triwulan", "Susun laporan konsolidasi")}. Profil risiko, distribusi level, lima risiko prioritas, realisasi dan progres RTP, serta kejadian signifikan terisi otomatis. Tambahkan pola hambatan dan rekomendasi untuk Direktur, lalu kirim. Periode lama tersedia di <b>Riwayat laporan konsolidasi</b>.</p>`],
  ];
  const L3 = [
    ["Masuk sebagai SPI", `<p>Pilih peran <b>Lini 3 · Satuan Pengawasan Internal</b>. SPI dapat membuka seluruh menu dan data semua lini, mengelola Pengaturan bersama admin, dan menyetujui peran pengguna.</p>`],
    ["Kelola pengguna dan unit", `<p>${M("Pengaturan")}: setujui atau cabut peran pengguna, tambah dan ubah unit kerja, dan tetapkan acuan penilaian (Lampiran 3A/3B serta selera bawaan).</p>`],
    ["Nilai kepatuhan proses", `<p>${M("Pengawasan SPI")}: matriks indeks kepatuhan per unit dengan 10 kriteria, termasuk implementasi RTP. Gunakan matriks ini untuk memilih unit yang perlu direviu lebih dalam.</p>`],
    ["Audit dengan kriteria dan KKA", `<p>${M("Pengawasan SPI", "Kriteria audit")} berisi 40 kriteria berdasarkan pasal Perdir 266/2026: 11 kriteria tata kelola rumah sakit, 22 kriteria unit kerja (Lini 1), dan 7 kriteria UMR (Lini 2). Formulir kosong dapat dicetak untuk pemeriksaan lapangan.</p><p>${M("Kertas kerja audit (KKA)", "Buat KKA")}: pilih sasaran audit. Hasil pemeriksaan sistem terisi otomatis beserta saran nilai. Auditor menetapkan penilaian (Sesuai, Sebagian sesuai, Tidak sesuai, Tidak berlaku), bukti yang diperiksa, dan catatan. Skor dan predikat dihitung otomatis. Simpan sebagai <b>final</b>, lalu <b>Cetak formulir</b> untuk ditandatangani. Dari tombol <b>Lihat</b>, kriteria yang belum sesuai dapat langsung <b>dijadikan temuan</b>.</p>`],
    ["Catat temuan", `<p>${M("Pengawasan SPI", "Catat temuan")}. Templat berisi:</p><ol><li>Identitas: unit, aspek, risiko terkait, prioritas, dan batas waktu.</li><li><b>Kondisi</b>, <b>kriteria</b> (pasal acuan), <b>sebab</b>, <b>akibat</b>, dan <b>rekomendasi</b>.</li></ol>`],
    ["Verifikasi tindak lanjut", `<p>Setelah unit menanggapi, status menjadi <b>Menunggu verifikasi</b>. Pilih <b>Verifikasi</b>, isi tanggal, hasil (Memadai atau Belum memadai), dan catatan. Temuan hanya dapat ditutup (<b>Selesai</b>) bila hasilnya Memadai.</p>`],
    ["Jejak audit", `<p>${M("Jejak audit")}: seluruh perubahan data di semua lini, dengan pengubah, waktu, dan isi sebelum dan sesudah. Riwayat dicatat otomatis oleh basis data dan tidak dapat diubah atau dihapus oleh siapa pun, termasuk admin.</p>`],
  ];
  const card = (r, title, steps) => `<details class="g" ${r === role ? "open" : ""} style="padding-bottom:4px"><summary><span class="rolepill rp-${r}">${ROLE_SHORT[r]}</span>${title}${r === role ? ` <span class="tag ok">Peran Anda</span>` : ""}</summary><div class="gb">${steps.map(([t, b], i) => step(i + 1, t, b, false)).join("")}</div></details>`;
  const order = [["L1", "Pemilik dan Pengelola Risiko unit", L1], ["L2", "Unit Manajemen Risiko", L2], ["L3", "Satuan Pengawasan Internal", L3]].sort((a, b) => (a[0] === role ? -1 : b[0] === role ? 1 : 0));
  return head("Panduan pengisian", "Langkah kerja setiap lini sesuai Peraturan Direktur No. 266 Tahun 2026. Setiap langkah menyebut menu dan tombol yang digunakan.") +
  `<div class="panel" style="margin-bottom:14px"><h2>Alur terintegrasi tiga lini</h2>
    <div class="flow"><span>L1 Konteks</span><i>→</i><span>L1 Register</span><i>→</i><span>L2 Validasi</span><i>→</i><span>L1 RCA</span><i>→</i><span>L1 RTP</span><i>→</i><span>L1 Implementasi</span><i>→</i><span>L1 Realisasi triwulan</span><i>→</i><span>L1 Laporan unit</span><i>→</i><span>L2 Reviu</span><i>→</i><span>L2 Konsolidasi</span><i>→</i><span>L3 Pengawasan dan temuan</span><i>→</i><span>L1 Tanggapan</span><i>→</i><span>L3 Verifikasi</span></div>
    <p class="small muted" style="margin:6px 0 0">Data mengalir otomatis antarlangkah: rekomendasi RCA menjadi RTP, catatan implementasi mengisi realisasi triwulan, dan seluruhnya membentuk laporan unit, laporan konsolidasi, dasbor, serta indeks kepatuhan SPI.</p></div>
  ${order.map(([r, t, s]) => card(r, t, s)).join("")}
  <div class="panel" style="margin:14px 0"><h2>Tombol yang sama di setiap menu</h2><div class="tablewrap"><table><thead><tr><th>Tombol</th><th>Fungsi</th><th>Siapa</th></tr></thead><tbody>

  <div class="panel" style="margin-bottom:14px"><h2>Hak akses per lini</h2>

  <tr><td>Kriteria audit dan KKA</td><td>Tidak dapat dibuka</td><td>Tidak dapat dibuka</td><td>Menyusun, mencetak, dan menjadikan temuan</td></tr>
  <tr><td>Jejak audit</td><td>Riwayat data unitnya lewat tombol Riwayat</td><td>Riwayat data unit lewat tombol Riwayat</td><td>Seluruh perubahan semua lini</td></tr>

/* ========== VIEW: Pengaturan ========== */
function vSettings() {
  let h = head("Pengaturan", "Unit kerja, peran pengguna, dan acuan penilaian. Hanya dapat dibuka dan diubah oleh admin (pemilik aplikasi) dan SPI.");
  const ad = isAdmin() && !S.readOnly;
  h += `<div class="grid g2" style="margin-bottom:14px"><div class="panel"><h2>Acuan penilaian</h2>
    <label class="f"><span>Tahun berjalan</span><input type="number" id="cfgTahun" value="${esc(S.cfg.tahun)}" ${ad ? "" : "disabled"}></label>
    <label class="f"><span>Acuan level risiko</span><select id="cfgAcuan" ${ad ? "" : "disabled"}><option value="3B" ${S.cfg.acuan === "3B" ? "selected" : ""}>Lampiran 3B: Rendah 1–6, Sedang 7–12, Tinggi 13–19, Sangat Tinggi 20–25</option><option value="3A" ${S.cfg.acuan === "3A" ? "selected" : ""}>Lampiran 3A: Rendah 1–4, Sedang 5–9, Tinggi 10–15, Sangat Tinggi 16–25</option></select><span class="hint">Pedoman memuat dua rentang berbeda. Lampiran 3B selaras dengan format laporan Lampiran 10.</span></label>
    <label class="f"><span>Selera risiko bawaan (bila unit belum menetapkan)</span><input type="number" min="1" max="25" id="cfgSelera" value="${esc(S.cfg.seleraDefault)}" ${ad ? "" : "disabled"}></label>
    ${ad ? `<button class="btn pri" data-act="savecfg">Simpan acuan</button>` : ""}</div>
    <div class="panel"><div class="row"><h2 style="margin:0">Unit kerja</h2><span class="spacer"></span>${ad ? `<button class="btn pri sm" data-act="editunit">Tambah unit</button>` : ""}</div>
    ${unitsSorted().length ? `<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Unit</th><th>Singkatan</th><th>Pemilik risiko</th><th></th></tr></thead><tbody>${unitsSorted().map(([id, u]) => `<tr><td>${esc(u.nama)}</td><td>${esc(u.singkatan || "–")}</td><td>${esc(u.pemilik || "–")}</td><td><div class="acts">${ad ? `<button class="btn sm" data-act="editunit" data-id="${id}">Ubah</button>` : ""}${riwBtn("units", id, u.nama)}</div></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Belum ada unit. Tambahkan unit kerja agar Lini 1 dapat memilih unitnya.</p>`}</div></div>`;
  if (S.mode === "db") {
    const ids = [...new Set([...Object.keys(S.members), ...Object.keys(S.roles)])];
    const ap = canApprove(), pend = new Set(pendingRequests().map(([id]) => id));
    const desc = (x) => x?.role ? `${ROLE_SHORT[x.role]}${x.unitId ? " · " + unitName(x.unitId) : ""}` : "–";
    h += `<div class="panel" style="margin-bottom:14px"><div class="row"><h2 style="margin:0">Pengguna dan hak akses</h2><span class="spacer"></span>${pend.size ? `<span class="tag warn">${pend.size} menunggu persetujuan</span>` : ""}</div>
    ${ids.length ? `<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Pengguna</th><th>Peran aktif</th><th>Permintaan</th><th>Jabatan</th><th>Status</th><th></th></tr></thead><tbody>${ids.map((id) => { const r = S.roles[id], q = S.members[id]; return `<tr><td>${esc(personName(id))}</td><td>${r?.role ? `<span class="rolepill rp-${r.role}">${esc(ROLE_SHORT[r.role])}</span>${r.unitId ? `<br><span class="small">${esc(unitName(r.unitId))}</span>` : ""}` : "–"}</td><td>${pend.has(id) ? esc(desc(q)) : "–"}</td><td>${esc(r?.jabatan || q?.jabatan || "–")}</td><td>${pend.has(id) ? `<span class="tag warn">Menunggu</span>` : r ? `<span class="tag ok">Aktif</span>` : `<span class="tag">Belum mengajukan</span>`}</td><td><div class="row">${ap && pend.has(id) ? `<button class="btn sm pri" data-act="approverole" data-id="${id}">Setujui</button>` : ""}${ap ? `<button class="btn sm" data-act="pickrole" data-id="${id}">Tetapkan</button>` : ""}${ap && r && id !== S.me.id ? `<button class="btn sm" data-act="revokerole" data-id="${id}">Cabut</button>` : ""}</div></td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted">Belum ada pengguna yang mengajukan peran.</p>`}
        <p class="small muted">Pengguna mendaftar dengan email, lalu mengajukan peran. Admin atau SPI menyetujuinya di sini. Hak akses dijaga oleh Row Level Security di basis data: Lini 1 hanya dapat membaca dan mengubah data unitnya, UMR hanya dapat memvalidasi, dan penetapan peran hanya dapat dilakukan admin atau SPI. Admin ditetapkan melalui 02_tetapkan_admin.sql.</p></div>`;
  }
  const nC = COLS.reduce((a, c) => a + Object.values(S[c]).filter((x) => x.contoh).length, 0);
  if (nC && ad) h += `<div class="panel"><h2>Data contoh</h2><p>Aplikasi berisi ${nC} data contoh (empat kasus pelatihan: pasien jatuh, klaim BPJS, keluhan viral, dan informed consent) yang ditandai "contoh". Hapus sebelum dipakai untuk data riil.</p><button class="btn" data-act="delcontoh">Hapus semua data contoh</button></div>`;
  return h;
}

/* ========== Main render ========== */
function doRender() {
  document.querySelector(".app").classList.toggle("auth", S.mode === "login" || S.mode === "error");
  if (S.mode === "login") { $("#main").innerHTML = vLogin(); return; }
  if (S.mode === "error") { $("#main").innerHTML = emptyBox("SIM-Risiko belum dapat dibuka", esc(S.ui.err || "Terjadi kesalahan."), `<button class="btn" onclick="location.reload()">Muat ulang</button>`); return; }
  renderNav();
  const m = $("#main");
  if (S.mode === "loading") return;
  if (S.mode === "revoked") { m.innerHTML = emptyBox("Akses ke data tidak tersedia", "Muat ulang halaman untuk mencoba lagi."); return; }
  let pre = "";
  if (S.mode === "local") pre = `<div class="banner"><b>Mode lokal.</b> Data bersama tidak tersedia di tampilan ini, jadi isian hanya tersimpan di perangkat ini. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas kode agar Lini 1, 2, dan 3 bekerja pada data yang sama.</div>`;

  if (!canView(S.view)) S.view = allowedViews()[0];
  renderNav();

  const V = { temuan: vTemuan, validasi: vValidasi, impl: vImpl, jejak: vJejak, dashboard: vDashboard, konteks: vKonteks, register: vRegister, rca: vRCA, rtp: vRTP, events: vEvents, reports: vReports, spi: vSPI, guide: vGuide, settings: vSettings };

}

$("#dlgForm").addEventListener("submit", async (ev) => {

const fld = (name, label, val, o = {}) => {
  const t = o.type || "text", hint = o.hint ? `<span class="hint">${o.hint}</span>` : "";
  let inp;

  else if (t === "select") inp = `<select name="${name}" ${o.req ? "required" : ""}>${o.blank !== false ? `<option value="">${esc(o.blank || "Pilih…")}</option>` : ""}${o.opts.map((x) => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${String(val) === String(v) ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`;
  else if (t === "checkbox") return `<label class="row small" style="margin-bottom:10px"><input type="checkbox" name="${name}" ${val ? "checked" : ""}> ${esc(label)}</label>`;
  else inp = `<input type="${t}" name="${name}" value="${esc(val)}" ${o.req ? "required" : ""} ${o.min ? `min="${o.min}"` : ""} ${o.max ? `max="${o.max}"` : ""} placeholder="${esc(o.ph || "")}">`;

function unitOpts(only) { return unitsSorted().filter(([id]) => !only || canEditUnit(id)).map(([id, u]) => [id, u.nama]); }

const NEW_UNIT = "__new";
const newUnitFields = (show) => `<div id="newUnitBox" class="fs" style="${show ? "" : "display:none"}"><p class="small muted" style="margin:0 0 8px">Unit Anda belum ada di daftar. Isi data unit dan pemilik risikonya; Admin atau SPI dapat merapikannya nanti di Pengaturan.</p>

function openRole(memberId) {

  if (!self && !canApprove()) { toast("Hanya admin atau SPI yang dapat mengubah peran pengguna lain."); return; }
  openModal(self ? (direct ? "Pilih peran Anda" : "Ajukan peran Anda") : `Tetapkan peran: ${personName(id)}`, `<p class="small" style="margin-top:0">Peran menentukan menu dan data yang dapat Anda buka. Lini 1 hanya melihat dan mengisi data unitnya sendiri; Lini 2 (UMR) memvalidasi dan menyusun konsolidasi; Lini 3 (SPI) dapat membuka semua lini.</p>${direct ? "" : `<p class="small banner" style="margin:0 0 12px">Peran baru aktif setelah disetujui admin atau SPI.</p>`}

    ${newUnitFields(!m.unitId && !unitsSorted().length)}
    ${fld("jabatan", "Jabatan", m.jabatan || "", { type: "select", opts: ["Pemilik Risiko (kepala unit)", "Pengelola Risiko", "Koordinator UMR", "Anggota UMR", "Auditor SPI", "Kepala SPI", "Direktur"] })}`,

      if (!f.role) { toast("Pilih peran."); return false; }

  <h3>Lampiran 1. Register Risiko (Lampiran 4)</h3><table><tr><th>No</th><th>Sasaran</th><th>Kode</th><th>Uraian risiko</th><th>K</th><th>D</th><th>Level</th><th>Warna</th><th>Residu</th><th>Ket.</th></tr>${reg}</table>
  <h3>Lampiran 2. Status RTP (Lampiran 7)</h3><table><tr><th>No</th><th>Kode</th><th>Rencana tindak</th><th>PJ</th><th>Target</th><th>Sudah</th><th>Belum</th><th>Progres</th><th>Efektivitas</th><th>Hambatan</th><th>Tindak lanjut</th></tr>${rtp}</table>
  <h3>Lampiran 3. Catatan peristiwa risiko (Lampiran 8)</h3><table><tr><th>No</th><th>Tanggal</th><th>Uraian</th><th>Lokasi</th><th>D</th><th>Tindakan segera</th><th>Koreksi</th><th>Kode</th><th>SIK</th></tr>${ev}</table>`;
  saveFile(`Laporan_${(S.units[unitId]?.singkatan || "Unit")}_${key}.html`, docShell("Laporan triwulan unit", inner));
}
function dlUMR(key) {
  key = key || pkey(S.f.tahun, S.f.tw);
  const [yy, qq] = key.split("-").map(Number), rep = S.reports[`UMR_${key}`] || {}, c = consolidated(yy, qq), tot = c.rs.length;
  const LVN = ["Sangat Tinggi (Merah)", "Tinggi (Kuning)", "Sedang (Hijau)", "Rendah (Biru)"];
  const inner = `<p>Perihal: Laporan Konsolidasi Manajemen Risiko ${plabel(key)}<br>Yth. Direktur RSD K.R.M.T Wongsonegoro<br>di Tempat</p>
  <h3>Ringkasan eksekutif</h3><ol><li>Jumlah risiko merah (Sangat Tinggi): ${c.dist[0]}</li><li>Jumlah RTP terlambat: ${c.late.length}</li><li>Tiga insiden utama: ${c.topEv.map(([, e]) => esc(e.jenis + " · " + unitName(e.unitId) + ": " + e.uraian)).join("; ") || "tidak ada"}</li><li>Kepatuhan pelaporan eksternal (Kemenkes): ${c.sik.length ? `${c.sikOk} dari ${c.sik.length}` : "tidak ada KTD/Sentinel"}</li><li>Rekomendasi utama untuk Direktur: ${esc(rep.rekomendasi || "–")}</li></ol>
  <h3>A. Profil risiko rumah sakit</h3><p>Total risiko teridentifikasi: ${tot} risiko.</p><table><tr><th>Level</th><th>Jumlah</th><th>%</th></tr>${LVN.map((n, i) => `<tr><td>${n}</td><td>${c.dist[i]}</td><td>${tot ? pct(c.dist[i], tot) : 0}%</td></tr>`).join("")}</table>
  <p>Top 5 risiko prioritas:</p><table><tr><th>No</th><th>Kode</th><th>Risiko</th><th>Unit</th><th>Residu</th></tr>${c.top.map(([, r], i) => `<tr><td>${i + 1}</td><td>${esc(r.kode)}</td><td>${esc(r.peristiwa)}</td><td>${esc(unitName(r.unitId))}</td><td>${res(r)} ${lvl(res(r)).n}</td></tr>`).join("")}</table>
  <h3>B. Evaluasi pengendalian</h3><p>Realisasi RTP seluruh unit: ${c.due.length ? pct(c.done.length, c.due.length) : 0}% (dari ${c.due.length} RTP jatuh tempo).</p>${c.perUnit.length ? `<p>Unit dengan realisasi tertinggi: ${esc(c.perUnit[0][0])} (${c.perUnit[0][1]}%). Terendah: ${esc(c.perUnit[c.perUnit.length - 1][0])} (${c.perUnit[c.perUnit.length - 1][1]}%).</p>` : ""}<p>Ringkasan hambatan utama: ${esc(rep.hambatan || "–")}</p>
  <h3>C. Kejadian risiko signifikan</h3><table><tr><th>Tanggal</th><th>Unit</th><th>Jenis</th><th>Uraian</th><th>Tindakan</th></tr>${c.signif.map(([, e]) => `<tr><td>${fmtDate(e.waktuKejadian)}</td><td>${esc(unitName(e.unitId))}</td><td>${esc(e.jenis)}</td><td>${esc(e.uraian)}</td><td>${esc(e.tindakan)}</td></tr>`).join("")}</table>
  <h3>D. Rekomendasi UMR</h3><p>${esc(rep.rekomendasi || "–")}</p><p style="text-align:right">Semarang, ${rep.sentAt ? fmtDate(rep.sentAt) : "………………"}</p>
  <div class="ttd"><div>Mengetahui,<br>Ketua Komite Mutu<br><br><br><br>Nama Lengkap<br>NIP/NIK</div><div><br>Ketua Sub Unit Manajemen Risiko (UMR)<br><br><br><br>Nama Lengkap<br>NIP/NIK</div></div>`;
  saveFile(`Laporan_Konsolidasi_UMR_${key}.html`, docShell("Laporan konsolidasi UMR", inner));
}

/* ========== Event handlers ========== */
const ACT = {
  go: (d) => { S.view = d.v; window.scrollTo(0, 0); render(); },
  heat: (d) => { S.reg = { k: d.k, d: d.d }; S.view = "register"; render(); },
  clearheat: () => { S.reg = {}; render(); },
  unitfilter: (d) => { S.f.unit = d.id; render(); },
  setyear: (d) => { S.f.tahun = +d.y; render(); },
  riwayat: (d) => openRiwayat(d.t.includes(",") ? d.t.split(",") : d.t, d.id, d.j),
  // Register risiko
  openrisk: (d) => openRisk(d.id), newrisk: () => openRisk(null), riskdetail: (d) => openRiskDetail(d.id),
  delrisk: (d) => deleteRisk(d.id), withdraw: (d) => withdrawRisk(d.id), reassess: (d) => openReassess(d.id), eskalasi: (d) => openEskalasi(d.id),
  // RCA
  editrca: (d) => openRCA(d.id), viewrca: (d) => openRCAView(d.id), delrca: (d) => deleteRCA(d.id),
  // RTP dan implementasi
  newrtp: (d) => openRTP(null, d.risk), editrtp: (d) => openRTP(d.id), viewrtp: (d) => openRTP(d.id, null, true), delrtp: (d) => deleteRtp(d.id),
  impl: (d) => openImpl(d.id), impllog: (d) => openImplLog(d.id), impledit: (d) => openImpl(d.id, d.log), impldel: (d) => deleteImpl(d.id, d.log), monitor: (d) => openMonitor(d.id),
  // Peristiwa
  newevent: () => openEvent(null), editevent: (d) => openEvent(d.id), viewevent: (d) => openEvent(d.id, true),
  delevent: async (d) => { if (!confirm("Hapus catatan peristiwa ini? Isi terakhirnya tetap tersimpan di riwayat.")) return; if (await del("events", d.id)) toast("Peristiwa dihapus."); },
  // Konteks dan unit
  editkonteks: (d) => openKonteks(d.id), copykonteks: (d) => openKonteks(d.id, S.units[d.id]?.konteks?.[d.y]),
  delkonteks: async (d) => { if (!confirm(`Hapus konteks ${unitName(d.id)} tahun ${S.f.tahun}? Isi terakhirnya tetap tersimpan di riwayat.`)) return; if (await delKonteks(d.id, S.f.tahun)) toast("Konteks dihapus."); },
  editunit: (d) => openUnit(d.id), newunitlocal: () => openNewUnitLocal(),
  // Laporan
  editreport: (d) => openReport(d.id, d.k), dlreport: (d) => dlReport(d.id, d.k), reviu: (d) => openReviu(d.id, d.k),
  editumr: (d) => openUMR(d.k), dlumr: (d) => dlUMR(d.k), csvreg: () => csvRegister(),
  delreport: async (d) => { if (!confirm("Hapus draf laporan ini?")) return; if (await del("reports", d.id)) toast("Draf laporan dihapus."); },
  // Temuan SPI
  newaudit: () => openAudit(null), editaudit: (d) => openAudit(d.id), viewaudit: (d) => openAudit(d.id, "view"), verifaudit: (d) => openAudit(d.id, "verif"),
  delaudit: async (d) => { if (!confirm("Hapus temuan ini? Isi terakhirnya tetap tersimpan di riwayat.")) return; if (await del("audits", d.id)) toast("Temuan dihapus."); },
  deltanggapan: async (d) => { if (!confirm("Hapus tanggapan unit atas temuan ini?")) return; if (await del("tanggapan", d.id)) toast("Tanggapan dihapus."); },
  // Kriteria audit dan KKA
  spitab: (d) => { S.ui.spiTab = d.id; render(); },
  newkka: (d) => openKKANew(d.id), editkka: (d) => openKKA(d.id), viewkka: (d) => openKKAView(d.id), delkka: (d) => deleteKKA(d.id),
  printkka: (d) => { const x = S.kka[d.id]; if (x) printHtml(kkaDoc(x), kkaFile(x)); },
  dlkka: (d) => { const x = S.kka[d.id]; if (x) saveFile(kkaFile(x), kkaDoc(x)); },
  printblank: (d) => printHtml(kkaDoc(null, d.id), `KKA_kosong_${d.id}.html`),
  printkriteria: () => printHtml(kriteriaDoc(), "Kriteria_audit_manajemen_risiko.html"),
  kkatemuan: (d) => kkaToTemuan(d.id, d.c),
  // Jejak audit
  jejakload: () => { S.ui.jejak = null; render(); },
  jejakdetail: (d) => { const e = S.ui.jejak?.rows?.[+d.id]; if (e) openModal(`Rincian · ${TABEL_LABEL[e.tabel] || e.tabel}`, riwayatEntryHtml(e, true), { readOnly: true, wide: true }); },
  // Akun dan peran
  logout: async () => { await SB.auth.signOut(); location.reload(); },
  password: () => openPassword(false),
  authmode: (d) => { S.ui.auth = d.m; render(); },
  approverole: async (d) => { const q = S.members[d.id]; if (!q?.role || !canApprove()) return; await put("roles", d.id, { role: q.role, unitId: q.role === "L1" ? q.unitId || "" : "", jabatan: q.jabatan || "", nama: q.nama || "", email: q.email || "", approvedBy: S.me.id, approvedAt: new Date().toISOString() }); toast("Peran disetujui."); },
  revokerole: async (d) => { if (!canApprove() || !confirm(`Cabut peran ${personName(d.id)}? Pengguna hanya dapat membuka Panduan sampai peran ditetapkan lagi.`)) return; await del("roles", d.id); toast("Peran dicabut."); },
  pickrole: (d) => { if (S.mode !== "db" && S.mode !== "local") return; if (S.mode === "local") { toast("Di mode lokal, pilih peran dari menu Coba sebagai."); return; } openRole(d.id); },
  savecfg: async () => { const t = +$("#cfgTahun").value, a = $("#cfgAcuan").value, s = +$("#cfgSelera").value; if (!t || !s) return; await putCfg(Object.assign({}, S.cfg, { tahun: t, acuan: a, seleraDefault: s })); toast("Acuan penilaian disimpan."); },
  delcontoh: async () => { if (!confirm("Hapus semua data contoh? Data riil tidak terpengaruh.")) return; for (const c of COLS) for (const [id, x] of Object.entries(S[c])) if (x.contoh) await del(c, id); toast("Data contoh dihapus."); },
};
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]"); if (!a || a.tagName === "SELECT" || (a.tagName === "INPUT")) return;
  e.preventDefault(); const f = ACT[a.dataset.act]; if (f) f(a.dataset, a);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.filter) { S.f[t.dataset.filter] = t.dataset.filter === "unit" ? t.value : +t.value; render(); return; }
  if (t.dataset.act === "regstatus") { S.reg.status = t.value; render(); }
  if (t.dataset.act === "regprio") { S.reg.prio = t.checked; render(); }
  if (t.dataset.act === "jejaktabel") { S.ui.jejakT = t.value; S.ui.jejak = null; render(); }
  if (t.dataset.act === "jejakunit") { S.ui.jejakU = t.value; S.ui.jejak = null; render(); }
  if (t.dataset.act === "localrole") { S.me.role = t.value; S.ui.localRole = t.value; if (t.value !== "L1") S.f.unit = "all"; render(); }
  if (t.dataset.act === "localunit") { if (t.value === NEW_UNIT) { t.value = S.me.unitId || ""; openNewUnitLocal(); return; } S.me.unitId = t.value; render(); }
});
init();
</script>
</body>
</html>
